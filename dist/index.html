<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#ff645f" />
  <meta name="description" content="오늘의 할 일을 가볍게 정리하는 투두 리스트" />
  <title>오늘, 할 일</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23ff645f'/%3E%3Cpath d='M18 33l9 9 20-22' fill='none' stroke='white' stroke-width='7' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
  <style>
    :root {
      color-scheme: light;
      --coral: #ff645f;
      --coral-deep: #f34d54;
      --ink: #101d78;
      --ink-soft: #344397;
      --muted: #8d91a6;
      --paper: #ffffff;
      --cloud: #f3f5fb;
      --line: #e8eaf3;
      --shadow: 0 24px 60px rgba(30, 38, 91, .14);
      --radius-xl: 34px;
      --radius-lg: 24px;
      font-family: Inter, Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }
    html { min-width: 320px; background: #eef0f6; }
    body { margin: 0; min-height: 100vh; color: #1e2444; }
    button, input, select { font: inherit; }
    button { cursor: pointer; }

    .app {
      min-height: 100vh;
      background:
        radial-gradient(circle at 8% 2%, rgba(255,255,255,.28), transparent 23rem),
        linear-gradient(138deg, var(--coral) 0%, var(--coral-deep) 42%, #ff7971 100%);
      padding: 28px;
    }

    .shell {
      width: min(1180px, 100%);
      min-height: calc(100vh - 56px);
      margin: 0 auto;
      display: grid;
      grid-template-columns: 360px minmax(0, 1fr);
      background: rgba(255,255,255,.15);
      border: 1px solid rgba(255,255,255,.28);
      border-radius: 40px;
      box-shadow: 0 28px 80px rgba(91, 31, 50, .25);
      overflow: hidden;
      backdrop-filter: blur(18px);
    }

    .side {
      color: white;
      padding: 46px 38px 36px;
      display: flex;
      flex-direction: column;
      gap: 34px;
    }

    .brand { display: flex; align-items: center; justify-content: space-between; }
    .brand-mark { display: flex; align-items: center; gap: 12px; font-weight: 800; letter-spacing: -.03em; }
    .brand-icon { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 12px; background: var(--ink); }
    .today-kicker { margin: 0 0 8px; font-size: .9rem; font-weight: 700; opacity: .78; letter-spacing: .05em; }
    h1 { margin: 0; font-size: clamp(2.5rem, 5vw, 4.4rem); line-height: .98; letter-spacing: -.065em; }
    .date-label { margin: 15px 0 0; font-size: 1rem; opacity: .82; }

    .progress-card {
      padding: 22px;
      border-radius: var(--radius-lg);
      background: rgba(255,255,255,.16);
      border: 1px solid rgba(255,255,255,.2);
    }
    .progress-head { display: flex; align-items: end; justify-content: space-between; gap: 16px; }
    .progress-head strong { font-size: 1.08rem; }
    .progress-head span { font-size: .86rem; opacity: .8; }
    .progress-track { height: 8px; margin-top: 16px; background: rgba(16,29,120,.2); border-radius: 99px; overflow: hidden; }
    .progress-fill { height: 100%; width: 0; background: var(--ink); border-radius: inherit; transition: width .35s ease; }

    .quick-form { display: grid; gap: 12px; margin-top: auto; }
    .quick-form label { font-size: .86rem; font-weight: 750; opacity: .82; }
    .field {
      width: 100%; min-height: 52px; padding: 0 16px;
      border: 0; border-radius: 16px; outline: none;
      background: rgba(255,255,255,.95); color: #202443;
      box-shadow: 0 8px 18px rgba(81, 24, 47, .09);
    }
    .field:focus { box-shadow: 0 0 0 3px rgba(16,29,120,.25), 0 8px 18px rgba(81, 24, 47,.09); }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .add-button {
      min-height: 54px; border: 0; border-radius: 17px; color: white;
      background: var(--ink); font-weight: 800; box-shadow: 0 14px 24px rgba(16,29,120,.27);
      transition: transform .18s ease, box-shadow .18s ease;
    }
    .add-button:hover { transform: translateY(-2px); box-shadow: 0 18px 28px rgba(16,29,120,.32); }
    .add-button:active { transform: translateY(0); }

    .workspace {
      min-width: 0;
      background: var(--cloud);
      border-radius: var(--radius-xl) 0 0 var(--radius-xl);
      padding: 38px clamp(24px, 5vw, 62px) 42px;
      box-shadow: -16px 0 40px rgba(93, 38, 61, .08);
    }

    .calendar { display: grid; grid-template-columns: repeat(7, minmax(56px, 1fr)); gap: 10px; margin-bottom: 42px; }
    .day {
      min-height: 76px; border: 0; border-radius: 18px; color: var(--ink-soft); background: transparent;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px;
      transition: background .2s ease, box-shadow .2s ease, transform .2s ease;
    }
    .day strong { font-size: 1.05rem; }
    .day span { font-size: .75rem; font-weight: 700; opacity: .62; }
    .day:hover { background: rgba(255,255,255,.65); }
    .day.selected { background: white; color: var(--ink); box-shadow: 0 14px 28px rgba(43, 47, 100, .11); transform: translateY(-2px); }

    .list-heading { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 22px; }
    .list-heading h2 { margin: 0; color: var(--ink); font-size: clamp(1.8rem, 4vw, 2.7rem); letter-spacing: -.045em; }
    .task-count { color: var(--muted); font-size: .9rem; font-weight: 700; white-space: nowrap; }
    .filters { display: flex; gap: 8px; margin-bottom: 20px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
    .filter { border: 1px solid var(--line); background: white; color: #72778f; padding: 9px 14px; border-radius: 99px; font-size: .85rem; font-weight: 700; white-space: nowrap; }
    .filter.active { background: var(--ink); border-color: var(--ink); color: white; }
    .new-category { border: 0; background: transparent; color: var(--ink); padding: 4px 2px; text-align: left; font-size: .83rem; font-weight: 800; }
    .new-category:hover { text-decoration: underline; }

    .task-list { display: grid; gap: 24px; }
    .category-group { display: grid; gap: 12px; }
    .category-header { display: flex; align-items: center; gap: 10px; color: #747a93; font-size: .84rem; font-weight: 850; letter-spacing: .025em; }
    .category-header::after { content: ''; height: 1px; flex: 1; background: #dfe3ee; }
    .category-header .category-dot { width: 9px; height: 9px; }
    .task {
      --task-color: #7284ee;
      display: grid; grid-template-columns: 34px minmax(0,1fr) auto auto; align-items: center; gap: 14px;
      padding: 17px 18px; background: white; border: 1px solid rgba(225,227,238,.72);
      border-radius: 20px; box-shadow: 0 10px 26px rgba(44, 50, 92, .075);
      animation: enter .3s ease both;
    }
    @keyframes enter { from { opacity: 0; transform: translateY(8px); } }
    .check {
      width: 28px; height: 28px; border-radius: 50%; border: 2px solid color-mix(in srgb, var(--task-color), white 45%);
      background: color-mix(in srgb, var(--task-color), white 88%); display: grid; place-items: center; padding: 0;
    }
    .check svg { opacity: 0; transform: scale(.5); transition: .18s ease; }
    .task.done .check { background: var(--task-color); border-color: var(--task-color); }
    .task.done .check svg { opacity: 1; transform: scale(1); }
    .task-copy { min-width: 0; }
    .task-title { color: var(--ink-soft); font-weight: 800; font-size: 1rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .task-meta { display: flex; align-items: center; gap: 8px; margin-top: 5px; color: var(--muted); font-size: .78rem; }
    .category-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--task-color); flex: 0 0 auto; }
    .task-time { font-size: .78rem; font-weight: 800; color: #7d8191; white-space: nowrap; }
    .delete { border: 0; background: transparent; color: #a8abba; padding: 7px; border-radius: 10px; opacity: 0; transition: .18s ease; }
    .task:hover .delete, .delete:focus-visible { opacity: 1; }
    .delete:hover { color: var(--coral-deep); background: #fff0f0; }
    .task.done .task-title { color: #a9acbb; text-decoration: line-through; }
    .task.done .task-meta, .task.done .task-time { opacity: .6; }

    .empty { display: none; text-align: center; padding: 66px 20px; color: var(--muted); }
    .empty-icon { width: 66px; height: 66px; margin: 0 auto 17px; border-radius: 22px; background: white; display: grid; place-items: center; color: var(--ink); box-shadow: 0 12px 28px rgba(44,50,92,.08); }
    .empty strong { display: block; color: var(--ink-soft); margin-bottom: 7px; font-size: 1.05rem; }
    .mobile-add { display: none; }
    .toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 24px); background: #171a31; color: white; padding: 12px 18px; border-radius: 13px; font-size: .88rem; opacity: 0; pointer-events: none; transition: .25s ease; z-index: 20; }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    dialog { border: 0; padding: 0; width: min(92vw, 440px); border-radius: 28px; box-shadow: var(--shadow); }
    dialog::backdrop { background: rgba(21,24,52,.44); backdrop-filter: blur(5px); }
    .dialog-body { padding: 26px; }
    .dialog-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:22px; }
    .dialog-head h3 { margin: 0; color: var(--ink); font-size: 1.45rem; }
    .close { border:0; background:#f0f2f7; width:38px; height:38px; border-radius:50%; color:#555c76; }
    .dialog-form { display:grid; gap:13px; }
    .dialog-form .field { background:#f3f5f9; box-shadow:none; border:1px solid #e7e9f1; }

    @media (max-width: 820px) {
      .app { padding: 0; background: var(--coral); }
      .shell { min-height: 100vh; display: block; border: 0; border-radius: 0; box-shadow: none; }
      .side { min-height: 310px; padding: 30px 24px 76px; gap: 28px; }
      .quick-form { display: none; }
      .progress-card { margin-top: auto; padding: 18px; }
      h1 { font-size: 3.35rem; }
      .workspace { min-height: calc(100vh - 270px); margin-top: -38px; border-radius: 38px 38px 0 0; padding: 26px 20px 110px; }
      .calendar { margin: 0 -4px 30px; gap: 2px; }
      .day { min-width: 0; min-height: 66px; border-radius: 16px; }
      .day strong { font-size: .96rem; }
      .day span { font-size: .68rem; }
      .task { grid-template-columns: 31px minmax(0,1fr) auto; padding: 15px 14px; gap: 11px; }
      .delete { display: none; }
      .mobile-add { display: grid; place-items: center; position: fixed; right: 22px; bottom: 22px; width: 58px; height: 58px; border: 0; border-radius: 19px; background: var(--ink); color: white; box-shadow: 0 16px 32px rgba(16,29,120,.34); z-index: 10; }
    }

    @media (max-width: 430px) {
      .side { min-height: 288px; }
      h1 { font-size: 2.9rem; }
      .workspace { margin-top: -34px; padding-inline: 16px; }
      .calendar { grid-template-columns: repeat(7, 1fr); }
      .day { min-height: 61px; padding: 0; }
      .list-heading h2 { font-size: 1.85rem; }
      .task-time { font-size: .7rem; }
    }

    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; animation: none !important; transition: none !important; } }
  </style>
</head>
<body>
  <main class="app">
    <div class="shell">
      <aside class="side">
        <div class="brand">
          <div class="brand-mark"><span class="brand-icon" aria-hidden="true">✓</span><span>오늘,</span></div>
          <span aria-hidden="true">•••</span>
        </div>
        <section>
          <p class="today-kicker">TODAY</p>
          <h1><span id="openCount">0</span>개의<br />할 일</h1>
          <p class="date-label" id="fullDate"></p>
        </section>
        <section class="progress-card" aria-label="오늘의 진행률">
          <div class="progress-head"><strong>오늘의 진행률</strong><span id="progressText">0% 완료</span></div>
          <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
        </section>
        <form class="quick-form" id="quickForm">
          <label for="taskInput">새로운 할 일</label>
          <input class="field" id="taskInput" name="title" placeholder="무엇을 해야 하나요?" autocomplete="off" required maxlength="80" />
          <div class="form-row">
            <input class="field" name="time" type="time" value="09:00" aria-label="시간" />
            <select class="field" name="category" aria-label="카테고리"></select>
          </div>
          <button class="add-button" type="submit">할 일 추가</button>
        </form>
      </aside>

      <section class="workspace">
        <nav class="calendar" id="calendar" aria-label="날짜 선택"></nav>
        <div class="list-heading">
          <h2 id="listTitle">오늘의 할 일</h2>
          <span class="task-count" id="taskCount"></span>
        </div>
        <div class="filters" id="filters" aria-label="할 일 필터"></div>
        <div class="task-list" id="taskList" aria-live="polite"></div>
        <div class="empty" id="emptyState">
          <div class="empty-icon" aria-hidden="true">✓</div>
          <strong>이날의 할 일을 모두 마쳤어요</strong>
          <span>새로운 할 일을 추가하거나 다른 날짜를 골라보세요.</span>
        </div>
      </section>
    </div>
    <button class="mobile-add" id="mobileAdd" aria-label="할 일 추가">＋</button>
  </main>

  <dialog id="taskDialog">
    <div class="dialog-body">
      <div class="dialog-head"><h3>새로운 할 일</h3><button class="close" id="closeDialog" aria-label="닫기">✕</button></div>
      <form class="dialog-form" id="dialogForm">
        <input class="field" name="title" placeholder="무엇을 해야 하나요?" autocomplete="off" required maxlength="80" />
        <input class="field" name="time" type="time" value="09:00" aria-label="시간" />
        <select class="field" name="category" aria-label="카테고리"></select>
        <button class="new-category" type="button" data-add-category>＋ 새 카테고리 만들기</button>
        <button class="add-button" type="submit">할 일 추가</button>
      </form>
    </div>
  </dialog>
  <div class="toast" id="toast" role="status"></div>

  <script>
    const STORAGE_KEY = 'today-list-v1';
    const CATEGORY_KEY = 'today-list-categories-v1';
    const defaultCategories = [
      { name:'업무', color:'#7687ed' }, { name:'약속', color:'#ff8b83' },
      { name:'개인', color:'#58cda0' }, { name:'공부', color:'#f5b84b' }
    ];
    const customColors = ['#9b7bea', '#4ea8cc', '#ea769b', '#8eaf57', '#d68a48'];
    let categories;
    try { categories = JSON.parse(localStorage.getItem(CATEGORY_KEY)) || defaultCategories; } catch { categories = defaultCategories; }
    categories = categories.filter(c => c && c.name && c.color);
    const palette = Object.fromEntries(categories.map(c => [c.name, c.color]));
    const dayNames = ['일','월','화','수','목','금','토'];
    const today = new Date(); today.setHours(0,0,0,0);
    const iso = d => { const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0'); return `${y}-${m}-${day}`; };
    const seed = [
      { id: crypto.randomUUID(), title:'오늘의 우선순위 정리', time:'09:30', category:'업무', date:iso(today), done:false },
      { id: crypto.randomUUID(), title:'점심 후 20분 산책', time:'13:10', category:'개인', date:iso(today), done:false },
      { id: crypto.randomUUID(), title:'프로젝트 피드백 반영', time:'15:00', category:'업무', date:iso(today), done:false },
      { id: crypto.randomUUID(), title:'친구에게 안부 연락', time:'19:30', category:'약속', date:iso(today), done:true }
    ];
    let tasks;
    try { tasks = JSON.parse(localStorage.getItem(STORAGE_KEY)) || seed; } catch { tasks = seed; }
    let selectedDate = iso(today), activeFilter = '전체';

    const $ = s => document.querySelector(s);
    const els = { list:$('#taskList'), empty:$('#emptyState'), count:$('#taskCount'), open:$('#openCount'), fill:$('#progressFill'), progress:$('#progressText'), title:$('#listTitle'), toast:$('#toast') };
    const save = () => localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
    const escapeHtml = value => String(value).replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    const formatTime = value => { if (!value) return ''; const [h,m]=value.split(':'); const n=Number(h); return `${n < 12 ? '오전' : '오후'} ${String(n%12||12).padStart(2,'0')}:${m}`; };

    function renderCalendar() {
      const start = new Date(today); start.setDate(today.getDate()-3);
      $('#calendar').innerHTML = Array.from({length:7}, (_,i) => {
        const d=new Date(start); d.setDate(start.getDate()+i); const value=iso(d);
        return `<button class="day ${value===selectedDate?'selected':''}" data-date="${value}" aria-pressed="${value===selectedDate}"><strong>${d.getDate()}</strong><span>${dayNames[d.getDay()]}</span></button>`;
      }).join('');
      document.querySelectorAll('.day').forEach(btn => btn.addEventListener('click', () => { selectedDate=btn.dataset.date; render(); }));
    }

    function renderCategories() {
      const categoryOptions = categories.map(c => `<option value="${escapeHtml(c.name)}">${escapeHtml(c.name)}</option>`).join('');
      document.querySelectorAll('select[name="category"]').forEach(select => {
        const selected = select.value;
        select.innerHTML = categoryOptions + '<option value="__new__">＋ 새 카테고리 만들기</option>';
        select.value = palette[selected] ? selected : categories[0].name;
      });
      $('#filters').innerHTML = `<button class="filter ${activeFilter==='전체'?'active':''}" data-filter="전체">전체</button>` + categories.map(c => `<button class="filter ${activeFilter===c.name?'active':''}" data-filter="${escapeHtml(c.name)}">${escapeHtml(c.name)}</button>`).join('');
    }

    function renderTasks() {
      const dayTasks = tasks.filter(t => t.date === selectedDate);
      const shown = dayTasks.filter(t => activeFilter === '전체' || t.category === activeFilter).sort((a,b) => a.done-b.done || a.time.localeCompare(b.time));
      const taskMarkup = t => `<article class="task ${t.done?'done':''}" style="--task-color:${palette[t.category]||'#7687ed'}" data-id="${t.id}">
        <button class="check" aria-label="${t.done?'완료 취소':'완료로 표시'}" aria-pressed="${t.done}"><svg width="15" height="15" viewBox="0 0 16 16" aria-hidden="true"><path d="m3 8 3 3 7-7" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <div class="task-copy"><div class="task-title">${escapeHtml(t.title)}</div><div class="task-meta"><span class="category-dot"></span><span>${escapeHtml(t.category)}</span></div></div>
        <time class="task-time">${formatTime(t.time)}</time>
        <button class="delete" aria-label="${escapeHtml(t.title)} 삭제"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3m-8 0 1 13h8l1-13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      </article>`;
      const categoryOrder = categories.map(c => c.name);
      const groups = categoryOrder.map(category => ({ category, items: shown.filter(t => t.category === category) })).filter(group => group.items.length);
      els.list.innerHTML = groups.map(({category, items}) => `<section class="category-group" aria-label="${category} 할 일">
        <div class="category-header" style="--task-color:${palette[category]}"><span class="category-dot"></span><span>${category}</span></div>
        ${items.map(taskMarkup).join('')}
      </section>`).join('');
      els.empty.style.display = shown.length ? 'none' : 'block';
      els.count.textContent = `${shown.filter(t=>!t.done).length}개 남음`;
      const isToday = selectedDate === iso(today);
      const selected = new Date(selectedDate+'T00:00:00');
      els.title.textContent = isToday ? '오늘의 할 일' : `${selected.getMonth()+1}월 ${selected.getDate()}일의 할 일`;
      document.querySelectorAll('.task').forEach(row => {
        row.querySelector('.check').addEventListener('click', () => toggleTask(row.dataset.id));
        row.querySelector('.delete').addEventListener('click', () => deleteTask(row.dataset.id));
      });
      const todayTasks = tasks.filter(t=>t.date===iso(today)), done=todayTasks.filter(t=>t.done).length, open=todayTasks.length-done;
      const percentage=todayTasks.length?Math.round(done/todayTasks.length*100):0;
      els.open.textContent=open; els.fill.style.width=percentage+'%'; els.progress.textContent=percentage+'% 완료';
    }

    function render() { renderCalendar(); renderCategories(); renderTasks(); }
    function notify(message) { els.toast.textContent=message; els.toast.classList.add('show'); clearTimeout(notify.timer); notify.timer=setTimeout(()=>els.toast.classList.remove('show'),1800); }
    function createTask(data) {
      const title=String(data.title||'').trim(); if(!title) throw new Error('할 일 이름을 입력해주세요.');
      const task={ id:crypto.randomUUID(), title, time:data.time||'09:00', category:palette[data.category]?data.category:categories[0].name, date:data.date||selectedDate, done:false };
      tasks.push(task); save(); selectedDate=task.date; render(); notify('할 일을 추가했어요.'); return task;
    }
    function toggleTask(id) { const task=tasks.find(t=>t.id===id); if(!task) return; task.done=!task.done; save(); renderTasks(); notify(task.done?'멋져요, 완료했어요!':'다시 할 일로 옮겼어요.'); }
    function deleteTask(id) { const task=tasks.find(t=>t.id===id); if(!task) return; tasks=tasks.filter(t=>t.id!==id); save(); renderTasks(); notify('할 일을 삭제했어요.'); }
    function submitForm(event) { event.preventDefault(); const data=Object.fromEntries(new FormData(event.currentTarget)); createTask(data); event.currentTarget.reset(); const time=event.currentTarget.querySelector('[name=time]'); if(time) time.value='09:00'; $('#taskDialog').close(); }
    function addCategory() {
      const name = window.prompt('새 카테고리 이름을 입력해주세요.');
      if (name === null) return;
      const clean = name.trim().slice(0, 20);
      if (!clean) return notify('카테고리 이름을 입력해주세요.');
      if (palette[clean]) return notify('이미 있는 카테고리예요.');
      const color = customColors[(categories.length - defaultCategories.length) % customColors.length];
      categories.push({name:clean, color}); palette[clean]=color;
      localStorage.setItem(CATEGORY_KEY, JSON.stringify(categories)); renderCategories();
      document.querySelectorAll('select[name="category"]').forEach(select => select.value=clean);
      notify(`‘${clean}’ 카테고리를 만들었어요.`);
    }

    $('#fullDate').textContent = new Intl.DateTimeFormat('ko-KR',{year:'numeric',month:'long',day:'numeric',weekday:'long'}).format(today);
    $('#quickForm').addEventListener('submit',submitForm); $('#dialogForm').addEventListener('submit',submitForm);
    document.addEventListener('click', e => { if (e.target.closest('[data-add-category]')) addCategory(); });
    document.addEventListener('change', e => { if (e.target.matches('select[name="category"]') && e.target.value === '__new__') addCategory(); });
    $('#filters').addEventListener('click', e => { const btn=e.target.closest('.filter'); if(!btn)return; activeFilter=btn.dataset.filter; document.querySelectorAll('.filter').forEach(x=>x.classList.toggle('active',x===btn)); renderTasks(); });
    $('#mobileAdd').addEventListener('click',()=>{ $('#taskDialog').showModal(); $('#dialogForm [name=title]').focus(); });
    $('#closeDialog').addEventListener('click',()=>$('#taskDialog').close());
    $('#taskDialog').addEventListener('click',e=>{ if(e.target===$('#taskDialog')) $('#taskDialog').close(); });

    function registerWebMCP() {
      const context=document.modelContext; if(!context?.registerTool) return;
      const register = tool => { try { Promise.resolve(context.registerTool(tool)).catch(()=>{}); } catch {} };
      register({ name:'add_todo', title:'할 일 추가', description:'선택한 날짜 또는 지정한 날짜에 새 할 일을 추가합니다.', inputSchema:{type:'object',properties:{title:{type:'string'},time:{type:'string',pattern:'^([01]\\d|2[0-3]):[0-5]\\d$'},category:{type:'string',enum:['업무','개인','약속','공부']},date:{type:'string',format:'date'}},required:['title'],additionalProperties:false}, annotations:{readOnlyHint:false,untrustedContentHint:false}, execute(input){ const task=createTask(input); return {id:task.id,title:task.title,date:task.date,status:'created'}; } });
      register({ name:'list_todos', title:'할 일 보기', description:'선택한 날짜의 할 일과 완료 상태를 조회합니다.', inputSchema:{type:'object',properties:{date:{type:'string',format:'date'}},additionalProperties:false}, annotations:{readOnlyHint:true,untrustedContentHint:false}, execute(input){ const date=input.date||selectedDate; return {date,todos:tasks.filter(t=>t.date===date).map(({id,title,time,category,done})=>({id,title,time,category,done}))}; } });
      register({ name:'complete_todo', title:'할 일 완료', description:'할 일 ID로 특정 할 일을 완료 처리합니다.', inputSchema:{type:'object',properties:{id:{type:'string'}},required:['id'],additionalProperties:false}, annotations:{readOnlyHint:false,untrustedContentHint:false}, execute(input){ const task=tasks.find(t=>t.id===input.id); if(!task) throw new Error('할 일을 찾을 수 없습니다.'); task.done=true; save(); render(); return {id:task.id,status:'completed'}; } });
    }
    render(); registerWebMCP();
  </script>
</body>
</html>
